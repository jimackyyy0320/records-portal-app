name: student_portal_app
description: MIS-SHS Learner App — Native Android Student & Faculty Academic Portal with Offline QR/NFC Attendance & Recitation Sync.
publish_to: "none"
version: 1.2.0+3

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  connectivity_plus: ^6.1.0
  workmanager: ^0.10.9
  mobile_scanner: ^7.0.0
  nfc_manager: ^4.0.0
  nfc_manager_ndef: ^1.0.0
  ndef_record: ^1.0.0
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  webview_flutter: ^4.9.0
  share_plus: ^10.1.2
  qr_flutter: ^4.1.0
  intl: ">=0.19.0 <0.21.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/mis_logo.png
    - assets/school_lobby/catalog/
    - assets/school_lobby/characters/presets/
    - assets/school_lobby/characters/parts/body/
    - assets/school_lobby/characters/parts/eyes/
    - assets/school_lobby/characters/parts/outfit/
    - assets/school_lobby/characters/parts/hair/
    - assets/school_lobby/characters/parts/glasses/
    - assets/school_lobby/characters/parts/hat/
    - assets/school_lobby/characters/parts/bag/
